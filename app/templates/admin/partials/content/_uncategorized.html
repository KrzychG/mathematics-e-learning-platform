{% from "admin/partials/content/_topic_macros.html" import render_topics_table %}
{% if uncategorized_topics %}
<div class="card border-0 shadow-sm rounded-4 mb-4 border-start border-secondary border-4 overflow-hidden">
    <div class="card-header bg-white py-3 px-4 d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <span class="badge bg-secondary rounded-pill px-3 py-2 fw-bold">{{ UNCATEGORIZED_LABEL }}</span>
            <h5 class="mb-0 fw-bold text-secondary">Tematy nieprzypisane do żadnego działu</h5>
        </div>
    </div>
    <div class="card-body p-0">
        {{ render_topics_table(uncategorized_topics, edit_label='Przypisz/Edytuj', actions_width='240px') }}
    </div>
</div>
{% endif %}
