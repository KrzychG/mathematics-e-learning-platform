services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axioma-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      FLASK_APP: run.py
      FLASK_DEBUG: "0"
      FLASK_CONFIG: ${DOCKER_FLASK_CONFIG:-docker}
      APP_BASE_URL: ${APP_BASE_URL:-}
      SECRET_KEY: ${SECRET_KEY:-}
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-memory://}
      DATABASE_URL: sqlite:////app/instance/app.db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      USE_PROXY_FIX: ${USE_PROXY_FIX:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      FORCE_HSTS: ${FORCE_HSTS:-false}
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      MAIL_USE_SSL: ${MAIL_USE_SSL:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-}
      MAIL_SENDER_NAME: ${MAIL_SENDER_NAME:-Axioma - Platforma Edukacyjna}
      AUTO_SEED: ${AUTO_SEED:-auto}
    volumes:
      - axioma_instance:/app/instance
      - axioma_avatars:/app/app/static/uploads/avatars

volumes:
  axioma_instance:
  axioma_avatars:
